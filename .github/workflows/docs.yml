name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev zlib1g-dev

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate docs from canonical sources
        run: python scripts/sync-docs.py --write

      - name: Verify generated docs match canonical sources
        run: python scripts/sync-docs.py --check

      - name: Build site
        run: python -m mkdocs build --strict

      - name: Prepare lychee local site root
        run: |
          root="$RUNNER_TEMP/lychee-root"
          mkdir -p "$root"
          ln -s "$GITHUB_WORKSPACE/site" "$root/ai-due-diligence-playbook"
          echo "LYCHEE_ROOT=$root" >> "$GITHUB_ENV"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --verbose
            --root-dir "${{ env.LYCHEE_ROOT }}"
            --accept 200,204,206,429
            --exclude "https://calendly.com/.*"
            --exclude "https://eur-lex\.europa\.eu/.*"
            --remap "^https://josediegorobles\.github\.io/ai-due-diligence-playbook/(.*) file://${{ github.workspace }}/site/\$1"
            './site/**/*.html'
          fail: true

      - name: Verify build leaves no tracked or unexpected untracked changes
        run: |
          git status --short --untracked-files=all
          test -z "$(git status --short --untracked-files=all)"

      - name: Deploy to GitHub Pages
        run: python -m mkdocs gh-deploy --force --clean --verbose
